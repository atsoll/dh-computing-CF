<!DOCTYPE html>
<html ng-app="template" ng-controller="ctrl">
  <head>
    <meta charset="utf-16">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link  rel="shortcut icon" href="" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.6.4/angular-animate.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-sanitize/1.6.4/angular-sanitize.min.js" integrity="sha512-zIcdv1GbeK4BRG8F1+d238N9aCF6EZq5edKdElLtG8sT4V+1sz87cIf+QngHESim2f0xEcwRbAC9ZlRHublq4A==" crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://netdna.bootstrapcdn.com/bootstrap/3.0.3/css/bootstrap.min.css"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-ui-bootstrap/1.3.2/ui-bootstrap-tpls.js" ></script>
    <!--font-awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css" integrity="sha512-1PKOgIY59xJ8Co8+NE6FZ+LOAZKjy+KY8iq0G4B3CyeY6wYHN3yt9PW0XpSriVlkMXe40PTKnXrLnZ9+fkDaog==" crossorigin="anonymous" />

    <!--fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <!--scroll-->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-scroll/1.0.2/angular-scroll.min.js" integrity="sha512-1wYZXYWckZINGwEcMIjYjthjBO7w0vgbj4tqREKmbIj4Wy+v1GNcbi2A3Bh1OEHG9caYQg8mNtN89Btj9xubNw==" crossorigin="anonymous"></script>
    <!--custom-->
    <script src = "js/main.js"></script>
    <link rel="stylesheet" href="./style/main.css">
  </head>
  <body du-scroll-container id="scroll-container">
    <div id="navbar">

      <a href="{{page.link}}" class="nav-button" ng-repeat="page in model.menu" ng-class="model.active_page==page.title? 'menu-active' : '' " ng-style="" ng-click="model.active_page=page.title">{{page.title}}</a>
    </div>
    <div id="view-content" class="col-md-12 col-sm-12 col-lg-12 col-xl-10 offset-xl-1">
      <ng-view class="col-md-10 col-md-offset-1" autoscroll="true"></ng-view>
    </div>
    <div id="foot" >
      <div id="footer-content">
        <b>Questions or comments?</b> Contact <a href="mailto:anna.sollazzo@glasgow.ac.uk">anna.sollazzo@glasgow.ac.uk</a>
      </div>
    </div>
  </body>
</html>
